services:
  - type: web
    name: modulo-suprimentos
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: cd compras_app && gunicorn app:app
    envVars:
      - key: SUPRIMENTOS_CATALOG_MODE
        value: supabase
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
