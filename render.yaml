services:
  - type: web
    name: modulo-suprimentos
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # Um worker gthread evita multiplicar o consumo de memória. O limite de
    # requisições recicla o processo antes de acumular memória em bibliotecas
    # de DOCX/PDF e nas respostas JSON grandes das integrações.
    startCommand: cd compras_app && gunicorn --worker-class gthread --workers 1 --threads 2 --timeout 120 --graceful-timeout 120 --max-requests 50 --max-requests-jitter 10 app:app
    envVars:
      - key: SUPRIMENTOS_CATALOG_MODE
        value: supabase
      - key: SUPRIMENTOS_DATA_MODE
        value: supabase
      - key: SUPRIMENTOS_REQUIRE_LOGIN
        value: "1"
      - key: ERP_SHARED_RBAC_ENABLED
        value: "0"
      - key: ERP_FEATURE_FLAG
        value: "false"
      - key: ERP_PORTAL_SSO_ENABLED
        value: "0"
      - key: ERP_PORTAL_URL
        value: https://ji-portal-operacional.onrender.com
      - key: ERP_PORTAL_SSO_SECRET
        sync: false
      - key: SUPRIMENTOS_SESSION_SECRET
        sync: false
      - key: ERP_STOCK_API_URL
        sync: false
      - key: ERP_STOCK_PUBLIC_URL
        sync: false
      - key: ERP_MES_API_URL
        sync: false
      - key: ERP_MES_PUBLIC_URL
        sync: false
      - key: ERP_BACKEND_TOKEN
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
