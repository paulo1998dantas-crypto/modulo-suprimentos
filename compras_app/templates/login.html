<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Modulo Suprimentos</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <style>
    body{min-height:100vh;display:grid;place-items:center;background:#0f172a;margin:0;color:#0f172a}
    .login-card{width:min(420px,calc(100vw - 32px));background:#fff;border-radius:8px;padding:32px;box-shadow:0 24px 80px rgba(15,23,42,.35)}
    .login-card h1{margin:4px 0 8px;font-size:28px}
    .login-card p{margin:0 0 22px;color:#64748b;font-weight:700}
    .login-card label{display:block;margin-top:14px;font-size:12px;text-transform:uppercase;font-weight:900;color:#475569}
    .login-card input{width:100%;box-sizing:border-box;margin-top:6px;padding:12px;border:1px solid #cbd5e1;border-radius:6px;font-size:15px}
    .login-card button{width:100%;margin-top:22px;padding:13px;border:0;border-radius:6px;background:#2563eb;color:white;font-weight:900;font-size:15px;cursor:pointer}
    .login-error{margin:0 0 16px;padding:12px;border:1px solid #fecdd3;background:#fff1f2;color:#be123c;border-radius:6px;font-weight:800}
    .eyebrow{font-size:12px;text-transform:uppercase;font-weight:900;color:#2563eb}
  </style>
</head>
<body>
{% include "_portal_back.html" %}
  <main class="login-card">
    <div class="eyebrow">Modulo Suprimentos</div>
    <h1>Acesso</h1>
    <p>Use o mesmo usuario do Modulo Estoque.</p>
    {% if erro %}
    <div class="login-error">{{ erro }}</div>
    {% endif %}
    <form method="post" action="{{ url_for('login', next=next_url) }}">
      <label>Usuario
        <input name="username" autocomplete="username" required autofocus>
      </label>
      <label>Senha
        <input name="password" type="password" autocomplete="current-password" required>
      </label>
      <button type="submit">Entrar</button>
    </form>
  </main>
</body>
</html>
